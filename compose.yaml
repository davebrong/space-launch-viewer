name: launch-visibility
services:
  postgres:
    image: postgres:17.11-bookworm@sha256:3645570cccdfa447589da9f57dd740faa29b30938e861289a5574b6ca6b03826
    user: postgres
    environment:
      POSTGRES_USER: launch
      POSTGRES_DB: launch
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes: ["database:/var/lib/postgresql/data"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U launch -d launch"]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 1g
  api:
    build:
      context: .
      dockerfile: ops/api.Dockerfile
    environment: &python-env
      DATABASE_URL: postgresql+psycopg://launch:${POSTGRES_PASSWORD}@postgres:5432/launch
      APP_ORIGIN: ${COMPOSE_APP_ORIGIN:-http://127.0.0.1:3080}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      ADMIN_SECRET_HASH: ${ADMIN_SECRET_HASH:-}
      LV_DATA_DIR: /data
      LV_USER_AGENT: ${LV_USER_AGENT:-launch-visibility/0.1 (local pilot)}
      EMAIL_ENABLED: "false"
      PYTHONDONTWRITEBYTECODE: "1"
    command: ["sh", "-c", "python -m implementation.manage migrate && exec python -m uvicorn services.api.main:app --host 0.0.0.0 --port 8000 --no-access-log"]
    volumes: ["evidence:/data"]
    read_only: true
    tmpfs: [/tmp]
    depends_on:
      postgres: {condition: service_healthy}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/ready')"]
      interval: 15s
      timeout: 5s
      retries: 10
    mem_limit: 1g
  worker:
    build:
      context: .
      dockerfile: ops/api.Dockerfile
    environment: *python-env
    command: ["python", "-m", "services.worker.main"]
    volumes: ["evidence:/data"]
    read_only: true
    tmpfs: [/tmp]
    depends_on:
      api: {condition: service_healthy}
    restart: unless-stopped
    mem_limit: 1g
  web:
    build:
      context: .
      dockerfile: ops/web.Dockerfile
    environment:
      API_INTERNAL_URL: http://api:8000
      NEXT_TELEMETRY_DISABLED: "1"
      PORT: "3000"
      HOSTNAME: 0.0.0.0
    read_only: true
    tmpfs: [/tmp, /app/apps/web/.next/cache]
    depends_on:
      api: {condition: service_healthy}
    restart: unless-stopped
    mem_limit: 768m
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
  proxy:
    image: caddy:2-alpine@sha256:d8542f48d34a9cf4e4c11a478865229840e87e4c96ea3f439101f31a5d35f75f
    user: "1000:1000"
    ports: ["127.0.0.1:3080:8080"]
    volumes: ["./ops/Caddyfile:/etc/caddy/Caddyfile:ro"]
    read_only: true
    tmpfs: [/data, /config]
    depends_on:
      web: {condition: service_healthy}
    restart: unless-stopped
    mem_limit: 128m
volumes:
  database:
  evidence:
