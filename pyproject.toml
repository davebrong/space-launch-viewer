[project]
name = "launch-visibility"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.143.0", "uvicorn==0.54.0", "sqlalchemy==2.1.4",
  "alembic==1.20.0", "psycopg[binary]==3.3.6", "skyfield==1.55",
  "skyfield-data==7.0.0", "timezonefinder==9.0.0", "tzdata==2026.5",
  "geographiclib==2.1", "httpx==0.28.1", "jsonschema==4.26.0",
  "cryptography==50.0.2", "requests==2.34.2"
]
[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff==0.17.0",
    "pyproj==3.8.0",
    "icalendar==7.3.0",
    "openapi-spec-validator==0.7.2",
]
[tool.uv]
package = false
[tool.pytest.ini_options]
testpaths = ["tests/application"]
pythonpath = ["."]
[tool.ruff]
target-version = "py311"
line-length = 110
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
