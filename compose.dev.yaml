name: launch-visibility-dev
services:
  postgres:
    image: postgres:17.11-bookworm@sha256:3645570cccdfa447589da9f57dd740faa29b30938e861289a5574b6ca6b03826
    environment:
      POSTGRES_USER: launch
      POSTGRES_DB: launch
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run python tools/dev.py first}
    ports: ["127.0.0.1:55432:5432"]
    volumes: ["db:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U launch -d launch"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped
volumes:
  db:
